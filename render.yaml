services:
  # 1. Python ML Microservice
  - type: web
    name: parksmart-ml
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Spring Boot Backend Web Service
  - type: web
    name: parksmart-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/parksmart-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: parksmart-ml
          property: hostport
      - key: APP_JWT_SECRET
        sync: false
